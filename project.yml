name: Unpack
options:
  bundleIdPrefix: com.guylyons
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    ENABLE_HARDENED_RUNTIME: YES
    SWIFT_STRICT_CONCURRENCY: complete
targets:
  Unpack:
    type: application
    platform: macOS
    sources:
      - path: Unpack
      - path: Vendor/7zip/7zz
        buildPhase:
          copyFiles:
            destination: executables
        attributes: [CodeSignOnCopy]
      - path: Vendor/7zip/License.txt
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.guylyons.unpack
        PRODUCT_NAME: Unpack
        INFOPLIST_FILE: Unpack/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: Unpack/Resources/Unpack.entitlements
        CODE_SIGN_IDENTITY: "-"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        COMBINE_HIDPI_IMAGES: YES
  UnpackTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: UnpackTests
    dependencies:
      - target: Unpack
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.guylyons.unpack.tests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_IDENTITY: "-"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Unpack.app/Contents/MacOS/Unpack"
        BUNDLE_LOADER: "$(TEST_HOST)"
schemes:
  Unpack:
    build:
      targets:
        Unpack: all
        UnpackTests: [test]
    test:
      targets:
        - UnpackTests
